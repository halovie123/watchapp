plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.example.watchapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // 1. Khai báo đối tượng Properties
        Properties props = new Properties()

        // 2. Trỏ tới file local.properties (ở thư mục gốc của project)
        def propsFile = file("${project.rootDir}/local.properties")

        // 3. Nếu file tồn tại thì load dữ liệu vào biến props
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }

        // 4. Lấy giá trị GEMINI_API_KEY từ file
        def geminiKey = props.getProperty('GEMINI_API_KEY') ?: ""

        // 5. Đưa vào BuildConfig để code Java có thể gọi được
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
    }
    namespace 'com.example.watchapp'
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    // ViewPager2 for onboarding
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // RecyclerView for BLE device list
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    // LocalBroadcastManager for BLE events
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    // Activity Result API
    implementation 'androidx.activity:activity:1.7.2'
    // Firebase (nếu cần upload lên cloud)
    // Import the Firebase BoM
    implementation(platform("com.google.firebase:firebase-bom:34.7.0"))
    implementation("com.google.firebase:firebase-database")
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Call API gemini

    // SDK cho Google AI (Gemini)
    implementation("com.google.ai.client.generativeai:generativeai:0.9.0")
    // Thư viện hỗ trợ ListenableFuture (Guava)
    implementation("com.google.guava:guava:31.1-android")

    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    // Add the dependency for the Firebase SDK for Google Analytics
    implementation("com.google.firebase:firebase-analytics")




    // TODO: Add the dependencies for any other Firebase products you want to use
    // See https://firebase.google.com/docs/android/setup#available-libraries
    // For example, add the dependencies for Firebase Authentication and Cloud Firestore
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib since 1.8+")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib since 1.8+")
        }
    }
}